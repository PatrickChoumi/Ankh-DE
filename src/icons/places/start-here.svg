<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icône du bouton Démarrer d'Ankh DE.

  Dessinée pour ce projet, à la main, en novembre 2026. Elle remplace celle
  du thème d'icônes Fluent, qui est le quadrillage à quatre carreaux de
  Windows : DE-005 interdit tout logo de Microsoft, et une icône de bouton
  Démarrer est précisément l'endroit où il se glisserait.

  Le motif est l'ankh — la croix ansée égyptienne, signe de vie, qui donne
  son nom au projet. Il est dans le domaine public depuis trois mille ans.

  Elle suit le jeu de couleurs par la classe « ColorScheme-Text », comme
  toutes les icônes de Plasma : pas de couleur en dur hors du repli.
-->
<svg width="24" height="24" viewBox="0 0 24 24" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#363636; }</style>
  </defs>
  <g class="ColorScheme-Text" fill="currentColor" fill-rule="evenodd">
    <!-- La boucle, le montant et la traverse, d'un seul trait ; le second
         sous-chemin creuse l'œil de la boucle. -->
    <path d="M12 1.6a5.4 5.4 0 0 0-2.6 10.1H4.6v2.3h4.9V22.4h5V14h4.9v-2.3h-4.8A5.4 5.4 0 0 0 12 1.6z
             M12 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
  </g>
</svg>
