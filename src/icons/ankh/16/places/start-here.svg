<?xml version="1.0" encoding="UTF-8"?>
<!--
  Bouton Démarrer d'Ankh DE — id : ankh-de-demarrer

  Quatre carreaux en grille 2 x 2, monochromes, qui suivent le jeu de
  couleurs par « ColorScheme-Text ».

  Ce N'EST PAS le logo de Windows, et ce ne peut pas l'être : le logo de
  Microsoft est une marque déposée, et ce dépôt est public sous GPL-3.0. Une
  grille de quatre carreaux est en revanche un motif d'interface courant —
  c'est le glyphe « grille d'applications » de nombreux lanceurs libres — et
  elle ne reprend ni les couleurs, ni les proportions, ni la perspective de
  la marque.

  Pour avoir exactement le bouton de son choix, y compris sur sa propre
  machine, l'applet offre « useCustomButtonImage » et « customButtonImage » :
  c'est expliqué dans docs/INSTALL.md.

  Remplace le « start-here » du thème Fluent. Un dessin par taille : à 16 px,
  un trait qui tombe entre deux pixels se délave.
-->
<svg width="16" height="16" viewBox="0 0 16 16" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#1f2328; }</style>
  </defs>
  <g class="ColorScheme-Text" fill="currentColor">
    <rect x="1.0"  y="1.0"  width="6" height="6" rx="1"/>
    <rect x="9.0" y="1.0"  width="6" height="6" rx="1"/>
    <rect x="1.0"  y="9.0" width="6" height="6" rx="1"/>
    <rect x="9.0" y="9.0" width="6" height="6" rx="1"/>
  </g>
</svg>
