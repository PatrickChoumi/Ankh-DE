name: Construire

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Le lot 0 tient à ce job : le code n'a jamais été construit ailleurs que
  # sur Fedora 44, dans l'image d'Ankh (DE-001, ROADMAP lot 0.6).
  compiler:
    name: ${{ matrix.nom }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    defaults:
      run:
        # Sans cela, GitHub choisit le shell qu'il trouve dans l'image : sur
        # Ubuntu 26.04 il a pris sh (dash), qui ne connaît pas « done < <(…) ».
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: Fedora 44
            image: fedora:44
            paquets: >-
              cmake gcc-c++ extra-cmake-modules qt6-qtbase-devel
              kf6-kconfig-devel kf6-kcoreaddons-devel kf6-kguiaddons-devel
              kf6-kiconthemes-devel kf6-kwindowsystem-devel kf6-kcolorscheme-devel
              kf6-frameworkintegration-devel kdecoration-devel
              qt6-qtdeclarative-devel git
            installer: dnf install -y
          - nom: Arch
            image: archlinux:latest
            paquets: >-
              cmake make gcc extra-cmake-modules qt6-base qt6-declarative kconfig
              kcoreaddons kguiaddons kiconthemes kwindowsystem kcolorscheme
              frameworkintegration kdecoration git
            installer: pacman -Syu --noconfirm
          - nom: Ubuntu 26.04
            image: ubuntu:26.04
            paquets: >-
              cmake g++ extra-cmake-modules qt6-base-dev qt6-declarative-dev
              libkf6config-dev libkf6coreaddons-dev libkf6guiaddons-dev
              libkf6iconthemes-dev libkf6windowsystem-dev libkf6colorscheme-dev
              libkf6style-dev libkdecorations3-dev git
            installer: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
    steps:
      - name: Paquets de construction
        run: ${{ matrix.installer }} ${{ matrix.paquets }}

      - uses: actions/checkout@v5

      - name: Version de Plasma visée, et celle de la distribution
        run: |
          set -euo pipefail
          echo "Ankh DE vise : $(grep '^plasma=' src/decoration/VERSION-BREEZE)"
          echo "Plage éprouvée : $(grep '^plasma_min=' src/decoration/VERSION-BREEZE) $(grep '^plasma_max=' src/decoration/VERSION-BREEZE)"
          echo "Distribution : kdecoration $(pkg-config --modversion KDecoration3 2>/dev/null || echo 'version inconnue')"

      - name: Configurer
        # SANS -DANKH_DE_PLASMA_NON_TESTE=ON, délibérément (DE-016).
        #
        # Jusqu'au 2026-11-07 ce job passait l'override sur les trois
        # distributions. Conséquence : le garde-fou livré aux utilisateurs
        # n'était JAMAIS celui que la CI éprouvait, et personne n'a vu
        # qu'Ankh DE refusait de se construire sur Ubuntu 26.04 — sa propre
        # cible, en Plasma 6.6, quand le CMake exigeait 6.8.
        #
        # Les trois distributions tombent maintenant dans la plage éprouvée
        # (Ubuntu 26.04 : kdecoration 6.6.4 ; Fedora 44 et Arch : 6.8.x). Si
        # l'une d'elles en sort, ce job DOIT échouer : c'est le signal qu'il
        # faut rejouer la plage, pas la contourner.
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Compiler
        run: cmake --build build -j"$(nproc)"

      - name: Installer dans un dossier d'essai
        run: cmake --install build --prefix "${PWD}/essai"

      # Un greffon à qui il manque un symbole se charge à moitié : pire qu'un
      # greffon qui refuse de se charger (CLAUDE.md §3.14).
      - name: Vérifier les bibliothèques et les symboles
        run: |
          set -euo pipefail
          trouve=0
          while read -r greffon; do
            echo "== ${greffon}"
            ldd -r "${greffon}" 2>&1 | tee /tmp/ldd.txt
            if grep -qE 'not found|undefined symbol' /tmp/ldd.txt; then
              echo "::error::${greffon} : bibliothèque ou symbole manquant"
              exit 1
            fi
            trouve=$((trouve + 1))
          done < <(find essai -name '*.so')
          if (( trouve < 2 )); then
            echo "::error::seulement ${trouve} greffon(s) construit(s) ; 2 attendus"
            exit 1
          fi

      # DE-008, DE-016 : le garde-fou doit refuser une version HORS de la
      # plage éprouvée. On le prouve en resserrant la plage sur une valeur
      # absurde — c'est elle qui décide désormais, pas « plasma= ».
      #
      # Ce test a failli devenir décoratif : écrit pour « plasma= », il
      # aurait continué à passer sans rien éprouver dès que la décision est
      # passée à la plage. Un test qui ne peut plus échouer est pire que pas
      # de test (CLAUDE.md §0.5).
      - name: Le garde-fou refuse bien une version hors plage
        run: |
          set -euo pipefail
          cp src/decoration/VERSION-BREEZE /tmp/VERSION-BREEZE.bak
          # Les TROIS clés, pas seulement les bornes : « plasma= » doit
          # rester dans sa propre plage, sinon c'est ce contrôle-là qui
          # refuse, avec un autre message, et le test n'éprouve plus ce
          # qu'il croit. C'est exactement ce qui s'est passé au premier
          # passage de DE-016.
          sed -i -e 's/^plasma=.*/plasma=0.1/' \
                 -e 's/^plasma_min=.*/plasma_min=0.1/' \
                 -e 's/^plasma_max=.*/plasma_max=0.1/' src/decoration/VERSION-BREEZE
          if cmake -S . -B /tmp/garde > /tmp/garde.log 2>&1; then
            cp /tmp/VERSION-BREEZE.bak src/decoration/VERSION-BREEZE
            echo "::error::le garde-fou a laissé passer une version hors plage"
            exit 1
          fi
          cp /tmp/VERSION-BREEZE.bak src/decoration/VERSION-BREEZE
          # Mis à plat : CMake replie message() sur plusieurs lignes et
          # double des espaces, donc chercher la phrase dans la sortie brute
          # échouerait toujours. tests/garde-version.sh est tombé dessus.
          tr '\n' ' ' < /tmp/garde.log | tr -s ' ' > /tmp/garde.plat
          grep -qF "n'est éprouvé que de Plasma 0.1 à 0.1" /tmp/garde.plat \
            || { echo "::error::le refus ne vient pas du garde-fou"; cat /tmp/garde.log; exit 1; }
          echo "Le garde-fou refuse bien, et dit pourquoi."

      - name: Vérifier ce qui est installé
        run: |
          set -euo pipefail
          for attendu in \
            "share/plasma/look-and-feel/org.ankh.de.desktop/metadata.json" \
            "share/plasma/look-and-feel/org.ankh.de.desktop/contents/defaults" \
            "share/color-schemes/Ankh.colors" \
            "share/color-schemes/AnkhClair.colors" \
            "share/kstyle/themes/ankh.themerc"
          do
            if [[ ! -f "essai/${attendu}" ]]; then
              echo "::error::manquant à l'installation : ${attendu}"
              exit 1
            fi
            echo "ok  ${attendu}"
          done

  documents:
    name: Documents et licences
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # DE-005 : aucun actif dont la provenance n'est pas déclarée.
      - name: Garde-fou des licences
        run: ./ci/verifier-licences.sh

      # Le dépôt ne doit pas porter deux règles contradictoires : le
      # 2026-11-06, DE-011 a autorisé ce que CLAUDE.md interdisait encore.
      - name: Cohérence des décisions et des règles
        run: ./ci/verifier-coherence.sh

      # CLAUDE.md §3.8 : on doit pouvoir revenir à l'état de départ.
      # « installer.sh --barre » détruisait les barres de l'utilisateur sans
      # retour possible jusqu'au 2026-11-07 ; ce test fait le tour complet
      # sur un faux HOME, sans Plasma, et compare les octets.
      - name: Les barres de l'utilisateur reviennent intactes
        run: ./tests/barres.sh

      # DE-016 : le garde-fou de version s'éprouve sans Qt ni kdecoration,
      # parce qu'il vit dans cmake/GardeVersionPlasma.cmake. Douze cas, dont
      # les versions réellement rencontrées : 6.6 sur Ubuntu 26.04, 6.8 sur
      # Fedora 44 et Arch.
      - name: Le garde-fou de version garde ce qu'il doit
        run: ./tests/garde-version.sh

      # DE-007 : le tableau de fidélité est généré, jamais écrit à la main.
      - name: docs/FIDELITE.md est à jour avec bench/jetons.toml
        run: python3 bench/fidelite.py --verifier

      - name: Syntaxe des scripts
        run: |
          set -euo pipefail
          while read -r script; do
            bash -n "${script}" && echo "ok  ${script}"
          done < <(git ls-files '*.sh')

      # « bash -n » ne voit PAS un appel de fonction placé avant sa
      # définition : il échoue en « command not found » à l'exécution. Le
      # 2026-11-07, bench/vm/essayer.sh a perdu un passage en VM complet pour
      # cette seule faute d'ordre — vingt minutes de machine.
      - name: Aucune fonction appelée avant d'être définie
        run: python3 tests/ordre-des-fonctions.py $(git ls-files '*.sh')

      # Une variable renommée à moitié ne se voit NI à la syntaxe, NI au
      # lint d'ordre : « set -u » la transforme en « unbound variable » à
      # l'exécution. Le 2026-11-07, « selecteur_present » a tué un passage en
      # VM après dix-huit minutes, et shellcheck en a trouvé deux autres du
      # même genre à la ligne suivante — « nouvelles » et « module_present »,
      # restes de la réécriture de DE-015 — qui auraient tué les deux
      # passages d'après.
      #
      # Le jeu de codes est VOLONTAIREMENT étroit : SC2154 (référencée mais
      # jamais affectée) et SC2034 (affectée mais jamais lue), les deux faces
      # d'un renommage incomplet. Le reste de shellcheck donne 21 remarques
      # de style sur ce dépôt, dont des guillemets simples délibérés pour les
      # commandes passées à ssh : les activer en bloc ferait du bruit, et le
      # bruit finit par être ignoré.
      - name: Aucune variable renommée à moitié
        run: shellcheck -x -i SC2154,SC2034 -f gcc $(git ls-files '*.sh')

      - name: Syntaxe du Python
        run: |
          set -euo pipefail
          while read -r module; do
            python3 -m py_compile "${module}" && echo "ok  ${module}"
          done < <(git ls-files '*.py')

      - name: Syntaxe du JavaScript du thème global
        run: |
          set -euo pipefail
          while read -r script; do
            node --check "${script}" && echo "ok  ${script}"
          done < <(git ls-files 'src/lookandfeel/*.js' 'src/kwin/*.js')
